name: fast_golden_taxi
description: "Fast Golden Taxi - Multi-role ride-hailing application with Consumer, Driver, and Company interfaces."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  # Flutter SDK
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.3

  # Dependency Injection
  get_it: ^8.2.0

  # Networking
  dio: ^5.9.0
  web_socket_channel: ^3.0.1
  connectivity_plus: ^7.0.0

  # Logging
  talker_dio_logger: ^5.0.0
  talker_flutter: ^5.0.0

  # Firebase
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  firebase_analytics: ^12.0.1
  firebase_crashlytics: ^5.0.1
  firebase_messaging: ^16.0.1
  firebase_remote_config: ^6.0.1
  cloud_firestore: ^6.0.1

  # Authentication
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.3
  local_auth: ^2.3.0

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # Routing
  go_router: ^16.2.1

  # Theme & UI
  flex_color_scheme: ^8.4.0
  flutter_screenutil: ^5.9.3

  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.8
  dartz: ^0.10.1
  rxdart: ^0.28.0
  crypto: ^3.0.6
  jwt_decoder: ^2.0.1
  device_info_plus: ^12.1.0
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5

  # Code Generation
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Image Handling
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Error Tracking
  sentry: ^9.6.0

  # Performance
  worker_manager: ^7.2.6

  # UI Components
  modal_bottom_sheet: ^3.0.0
  dropdown_button2: ^2.3.9

  # Debugging
  awesome_dio_interceptor: ^1.3.0

  # Stack Trace
  stack_trace: ^1.12.1

  # Meta
  meta: any
  http_parser: any
dev_dependencies:
  # Flutter Testing
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  very_good_analysis: ^9.0.0

  # Code Generation
  build_runner: ^2.4.14
  freezed: ^3.0.0
  json_serializable: ^6.9.4
  riverpod_generator: ^2.3.9
  riverpod_lint: ^2.3.7

  # Build Tools
  flutter_flavorizr: ^2.4.1

  # Mocking
  mockito: ^5.4.4
  mocktail: ^1.0.4

  # Testing Utilities
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  # Fonts (to be added)
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
  #       - asset: assets/fonts/CustomFont-Bold.ttf
  #         weight: 700
